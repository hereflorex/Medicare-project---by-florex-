<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MediCare</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-hospital-user"></i>
                <span>MediCare</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" class="active"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li><a href="/appointments"><i class="fas fa-calendar"></i> Appointments</a></li>
                <li><a href="/doctors"><i class="fas fa-stethoscope"></i> Doctors</a></li>
                <li><a href="#"><i class="fas fa-prescription-bottle"></i> Prescriptions</a></li>
                <li><a href="#"><i class="fas fa-receipt"></i> Billing</a></li>
                <li><a href="/about"><i class="fas fa-info-circle"></i> About</a></li>
                <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <!-- Header -->
            <header class="dashboard-header">
                <h1>Welcome to Your Dashboard</h1>
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                    <span id="userName">User</span>
                </div>
            </header>

            <!-- Stats Cards -->
            <section class="stats-section">
                <div class="stat-card primary">
                    <div class="stat-icon">
                        <i class="fas fa-stethoscope"></i>
                    </div>
                    <div class="stat-content">
                        <h3>Total Doctors</h3>
                        <p class="stat-number" id="totalDoctors">0</p>
                    </div>
                </div>

                <div class="stat-card success">
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-content">
                        <h3>Total Patients</h3>
                        <p class="stat-number" id="totalPatients">0</p>
                    </div>
                </div>

                <div class="stat-card warning">
                    <div class="stat-icon">
                        <i class="fas fa-calendar-check"></i>
                    </div>
                    <div class="stat-content">
                        <h3>Appointments</h3>
                        <p class="stat-number" id="totalAppointments">0</p>
                    </div>
                </div>

                <div class="stat-card info">
                    <div class="stat-icon">
                        <i class="fas fa-hourglass-half"></i>
                    </div>
                    <div class="stat-content">
                        <h3>Pending</h3>
                        <p class="stat-number" id="pendingAppointments">0</p>
                    </div>
                </div>
            </section>

            <!-- Charts Section -->
            <section class="charts-section">
                <div class="chart-card">
                    <h3>Appointment Trends</h3>
                    <div class="chart-placeholder">
                        <canvas id="appointmentChart"></canvas>
                    </div>
                </div>

                <div class="chart-card">
                    <h3>Department Distribution</h3>
                    <div class="chart-placeholder">
                        <canvas id="departmentChart"></canvas>
                    </div>
                </div>
            </section>

            <!-- Recent Appointments -->
            <section class="recent-section">
                <h3>Recent Appointments</h3>
                <div id="recentAppointments" class="appointments-list">
                    <p>Loading...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        // Load dashboard data
        async function loadDashboardData() {
            try {
                const response = await fetch('/api/dashboard/stats');
                const data = await response.json();
                
                document.getElementById('totalDoctors').textContent = data.total_doctors;
                document.getElementById('totalPatients').textContent = data.total_patients;
                document.getElementById('totalAppointments').textContent = data.total_appointments;
                document.getElementById('pendingAppointments').textContent = data.pending_appointments;
            } catch (error) {
                console.error('Error loading dashboard data:', error);
            }
        }

        // Initialize charts
        function initCharts() {
            const ctx1 = document.getElementById('appointmentChart');
            if (ctx1) {
                new Chart(ctx1, {
                    type: 'line',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                        datasets: [{
                            label: 'Appointments',
                            data: [12, 19, 8, 15, 10, 16, 9],
                            borderColor: '#1e5a96',
                            backgroundColor: 'rgba(30, 90, 150, 0.1)',
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
            }

            const ctx2 = document.getElementById('departmentChart');
            if (ctx2) {
                new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: ['Cardiology', 'Neurology', 'Pediatrics', 'Orthopedics'],
                        datasets: [{
                            data: [25, 20, 30, 25],
                            backgroundColor: ['#1e5a96', '#4a90e2', '#7cb342', '#ffa726']
                        }]
                    },
                    options: {
                        responsive: true
                    }
                });
            }
        }

        // Load data on page load
        window.addEventListener('load', () => {
            loadDashboardData();
            initCharts();
        });
    </script>
</body>
</html>
