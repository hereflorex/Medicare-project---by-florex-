{% extends "base.html" %}
{% block title %}Medical Specialists{% endblock %}
{% block content %}
<div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:1.5rem;">
    {% for doctor in doctors %}
    <div class="card" style="text-align:center">
        <i class="fas fa-user-md" style="font-size:3.5rem; color:var(--primary); margin-bottom:1rem;"></i>
        <h3>Dr. {{ doctor.name }}</h3>
        <p style="color:var(--primary); font-weight:500">{{ doctor.specialization }}</p>
        <button class="btn btn-primary" onclick="bookAppointment({{ doctor.id }})" style="width:100%; margin-top:1.5rem">Book Now</button>
    </div>
    {% endfor %}
</div>
{% endblock %}
