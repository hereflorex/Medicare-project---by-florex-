<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediCare Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo" style="margin-bottom: 3rem;"><i class="fas fa-hand-holding-medical"></i> MediCare</div>
            <a href="/dashboard"><i class="fas fa-grid-2"></i> Dashboard</a>
            <a href="/doctors"><i class="fas fa-user-md"></i> Find Doctors</a>
            <a href="/appointments"><i class="fas fa-calendar-alt"></i> My Schedule</a>
            <a href="/about"><i class="fas fa-info-circle"></i> Support</a>
            <div style="margin-top: auto; padding-top: 10rem;">
                <a href="/logout" style="color: #ef4444;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3rem;">
                <h1 class="animate">{% block title %}{% endblock %}</h1>
                <div class="card animate" style="padding: 10px 20px; border-radius: 15px; display:flex; align-items:center; gap:10px">
                    <div style="width:35px; height:35px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; color:white">
                        {{ session['user_name'][0] }}
                    </div>
                    <strong>{{ session['user_name'] }}</strong>
                </div>
            </header>
            <div class="animate">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
