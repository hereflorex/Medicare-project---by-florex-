<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediCare Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2563eb; --sidebar: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { display: flex; background: #f1f5f9; min-height: 100vh; }
        
        .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid #e2e8f0; padding: 30px 20px; position: fixed; height: 100vh; }
        .main { margin-left: 260px; flex: 1; padding: 40px; }
        
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #64748b; text-decoration: none; border-radius: 10px; margin-bottom: 10px; transition: 0.3s; }
        .nav-link:hover, .active { background: #eff6ff; color: var(--primary); font-weight: 600; }
        
        .card { background: white; padding: 25px; border-radius: 15px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color:var(--primary); margin-bottom: 40px;"><i class="fas fa-heartbeat"></i> MediCare</h2>
        <a href="/dashboard" class="nav-link active"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="/doctors" class="nav-link"><i class="fas fa-user-md"></i> Find Doctors</a>
        <a href="/appointments" class="nav-link"><i class="fas fa-calendar-check"></i> Appointments</a>
        <a href="/logout" class="nav-link" style="margin-top: 50px; color: #ef4444;"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <div class="main">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h1>{% block title %}{% endblock %}</h1>
            <div style="font-weight:600;"><i class="fas fa-user-circle"></i> {{ session['user_name'] }}</div>
        </div>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
