<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare | Modern Health</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --primary: #0061ff; --bg: #f8fafc; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body { background: var(--bg); color: #1e293b; overflow-x: hidden; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 25px 8%; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); position: sticky; top:0; z-index:100; }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary); }

        .hero { display: flex; align-items: center; justify-content: space-between; padding: 60px 8%; min-height: 85vh; }
        .hero-text h1 { font-size: 3.5rem; line-height: 1.2; margin-bottom: 20px; }
        .hero-text p { color: #64748b; font-size: 1.1rem; margin-bottom: 30px; max-width: 500px; }

        .hero-img img { width: 100%; max-width: 500px; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.1)); animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .btn { padding: 14px 30px; border-radius: 50px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 10px 20px rgba(0,97,255,0.2); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(0,97,255,0.3); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); margin-left: 10px; }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 35px; border-radius: 25px; width: 90%; max-width: 400px; animation: pop 0.3s ease; }
        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1.5px solid #e2e8f0; border-radius: 12px; outline: none; }
        .close { float: right; cursor: pointer; font-size: 20px; color: #94a3b8; }
    </style>
</head>
<body>

<nav data-aos="fade-down">
    <div class="logo"><i class="fas fa-heartbeat"></i> MediCare</div>
    <button class="btn btn-outline" onclick="openM('loginModal')">Login</button>
</nav>

<section class="hero">
    <div class="hero-text" data-aos="fade-right">
        <h1>Smart Healthcare <br><span style="color:var(--primary)">For Your Family.</span></h1>
        <p>Book appointments, talk to specialists, and keep your health records secure all in one place.</p>
        <button class="btn btn-primary" onclick="openM('regModal')">Get Started Now</button>
    </div>
    <div class="hero-img" data-aos="fade-left">
        <!-- New Reliable Doctor Image Link -->
        <img src="https://cdni.iconscout.com/illustration/premium/thumb/female-doctor-illustration-download-in-svg-png-gif-file-formats--expert-professional-3d-character-pack-people-illustrations-5349191.png" alt="Doctor">
    </div>
</section>

<!-- Modals -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeM('loginModal')">&times;</span>
        <h2 style="margin-bottom: 15px;">Welcome Back</h2>
        <input type="email" id="lemail" placeholder="Email">
        <input type="password" id="lpass" placeholder="Password">
        <button class="btn btn-primary" style="width: 100%" onclick="login()">Login</button>
    </div>
</div>

<div id="regModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeM('regModal')">&times;</span>
        <h2 style="margin-bottom: 15px;">Create Account</h2>
        <input type="text" id="rname" placeholder="Full Name">
        <input type="email" id="remail" placeholder="Email">
        <input type="password" id="rpass" placeholder="Password">
        <select id="rrole">
            <option value="patient">I am a Patient</option>
            <option value="doctor">I am a Doctor</option>
        </select>
        <button class="btn btn-primary" style="width: 100%" onclick="register()">Register</button>
    </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init();
    function openM(id) { document.getElementById(id).style.display = 'flex'; }
    function closeM(id) { document.getElementById(id).style.display = 'none'; }

    async function login() {
        const email = document.getElementById('lemail').value;
        const password = document.getElementById('lpass').value;
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if(data.success) window.location.href = '/dashboard';
        else alert(data.error); // Ab sirf simple error message aayega
    }

    async function register() {
        const name = document.getElementById('rname').value;
        const email = document.getElementById('remail').value;
        const password = document.getElementById('rpass').value;
        const role = document.getElementById('rrole').value;
        
        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, email, password, role})
            });
            const data = await res.json();
            if(data.success) { alert("Success! Please Login."); location.reload(); }
            else alert(data.error);
        } catch(e) { alert("Error connecting to server"); }
    }
</script>
</body>
</html>
