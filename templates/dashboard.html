{% extends "base.html" %}
{% block title %}Dashboard Overview{% endblock %}
{% block content %}
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
    <div class="card" style="border-left: 5px solid #2563eb;">
        <p style="color: #64748b;">Verified Doctors</p>
        <h2 style="font-size: 30px;">{{ stats.doctors }}</h2>
    </div>
    <div class="card" style="border-left: 5px solid #10b981;">
        <p style="color: #64748b;">Total Users</p>
        <h2 style="font-size: 30px;">{{ stats.patients }}</h2>
    </div>
    <div class="card" style="border-left: 5px solid #f59e0b;">
        <p style="color: #64748b;">My Appointments</p>
        <h2 style="font-size: 30px;">{{ stats.appointments }}</h2>
    </div>
</div>

<div class="card" style="margin-top: 30px;">
    <h3>Quick Actions</h3>
    <div style="display:flex; gap:15px; margin-top:15px;">
        <a href="/doctors" class="btn btn-primary">Book New Appointment</a>
        <a href="/about" class="btn btn-outline" style="border:1px solid #ddd; padding:10px 20px; text-decoration:none; color:black; border-radius:8px;">Need Help?</a>
    </div>
</div>
{% endblock %}
