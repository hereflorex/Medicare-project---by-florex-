{% extends "base.html" %}
{% block title %}Overview{% endblock %}
{% block content %}
<div class="stats-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:1.5rem;">
    <div class="card">
        <p style="color:var(--text-gray)">Active Doctors</p>
        <h2 style="font-size: 2rem; color:var(--primary)">{{ stats.doctors }}</h2>
    </div>
    <div class="card">
        <p style="color:var(--text-gray)">Total Patients</p>
        <h2 style="font-size: 2rem; color:var(--primary)">{{ stats.patients }}</h2>
    </div>
    <div class="card">
        <p style="color:var(--text-gray)">My Appointments</p>
        <h2 style="font-size: 2rem; color:var(--primary)">{{ stats.appointments }}</h2>
    </div>
</div>
{% endblock %}
